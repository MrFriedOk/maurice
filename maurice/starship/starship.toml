add_newline = false
# layout of icons and stuff uwwu
format = """
$directory$git_branch
$character
"""

right_format = """
stuff_on_the_right
"""

continuation_prompt = '>>'

palette = 'colors'

#colors, from glacier https://github.com/dexpota/kitty-themes
[palettes.colors]
color0 = '#1c1c1c'
color8 = '#4a4a4a'
color1 = '#b0736f'
color9 = '#c48a86'
color2 = '#8fa38a'
color10 = '#a3b59e'
color3 = '#b8a77c'
color11 = '#cbbb92'
color4  = '#7f94a8'
color12 = '#96a9bb'
color5 = '#a28aa5'
color13 = '#b5a0b8'
color6 = '#7fa3a0'
color13 = '#96b5b2'
color7 = '#c8c8c4'
color15 = '#e8e8e4'

[character]
success_symbol = "[>](color9 bold)"
error_symbol = "[!](@{error})"
#idk what this honestly
vicmd_symbol = "[>](color6)"

