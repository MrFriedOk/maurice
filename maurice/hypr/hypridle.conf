general {
	lock_cmd = qs ip call lock lock
	before_sleep_cmd = qs ipc call lock lock
	after_slepp_cmd = hyprctl dispatch dpms on
}

listener{
	timeout = 60
}
listener{
	timeout = 120
	on_timeout = qs ipc call lock lock
}
listener{
	timerout = 180
	on_timeout = hyprctl dispatch dpms off
	on_resume = hyprctl dispatch dpms on
}
